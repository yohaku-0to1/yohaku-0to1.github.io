<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Studio Kit - 投稿準備アシスタント</title>
    
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    
</head>
<body class="font-sans">

    <div id="aurora-background"></div>

    <main class="main-container">
        <header class="card mb-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold">YouTube Studio Kit</h1>
            <a href="../index.html" class="px-4 py-2 text-sm font-semibold bg-white/10 rounded-lg hover:bg-white/20 transition-colors">ホームに戻る</a>
        </header>

        <!-- Tab Navigation -->
        <div class="card">
            <div class="flex border-b border-white/20">
                <button id="tab-thumbnail" class="tab-button active flex-1 py-3 px-4 font-semibold transition-colors">サムネイルプレビュー</button>
                <button id="tab-timestamp" class="tab-button flex-1 py-3 px-4 font-semibold transition-colors">タイムスタンプエディタ</button>
            </div>

            <!-- Thumbnail Previewer Content -->
            <div id="content-thumbnail" class="py-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div id="drop-zone-1" class="border-2 border-dashed border-gray-500 rounded-lg p-8 text-center cursor-pointer hover:bg-white/5 transition-colors">
                        <p>サムネイルAをドラッグ＆ドロップ</p>
                        <p class="text-sm text-gray-400">またはクリックして選択</p>
                        <input type="file" id="file-input-1" class="hidden" accept="image/*">
                    </div>
                    <div id="drop-zone-2" class="border-2 border-dashed border-gray-500 rounded-lg p-8 text-center cursor-pointer hover:bg-white/5 transition-colors">
                        <p>サムネイルB（比較用）</p>
                        <p class="text-sm text-gray-400">またはクリックして選択</p>
                        <input type="file" id="file-input-2" class="hidden" accept="image/*">
                    </div>
                </div>
                <div id="previews-container" class="mt-6 space-y-8">
                    <!-- Previews will be generated here by JavaScript -->
                </div>
            </div>

            <!-- Timestamp Editor Content (Initially hidden) -->
            <div id="content-timestamp" class="py-4 hidden">
                <div id="youtube-url-container">
                    <h3 class="font-bold mb-2">1. YouTube動画のURLを入力</h3>
                    <form id="youtube-url-form" class="flex items-center gap-2">
                        <input type="text" id="youtube-url" placeholder="https://www.youtube.com/watch?v=..." class="flex-grow bg-white/10 border border-white/20 rounded-lg px-3 py-2">
                        <button type="submit" class="bg-pink-600 hover:bg-pink-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">読み込む</button>
                    </form>
                </div>

                <div id="player-container" class="hidden mt-6">
                    <h3 class="font-bold mb-2">2. 動画を再生してチャプターを作成</h3>
                    <div id="player" class="w-full aspect-video bg-black rounded-lg mb-4"></div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <!-- Editor -->
                        <div>
                            <form id="timestamp-form" class="flex items-center gap-2 mb-4">
                                <button type="button" id="get-current-time" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-3 rounded-lg transition-colors" title="現在の再生時間を入力">▶</button>
                                <input type="text" id="timestamp-time" placeholder="HH:MM:SS" class="bg-white/10 border border-white/20 rounded-lg px-3 py-2 w-28">
                                <input type="text" id="timestamp-title" placeholder="チャプター名" class="flex-grow bg-white/10 border border-white/20 rounded-lg px-3 py-2">
                                <button type="submit" class="bg-pink-600 hover:bg-pink-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">追加</button>
                            </form>
                            <div id="timestamp-list" class="space-y-2">
                                <!-- Timestamp items will be generated here -->
                            </div>
                        </div>
                        <!-- Output & Controls -->
                        <div>
                            <textarea id="timestamp-output" readonly class="w-full h-48 bg-black/20 rounded-lg p-2 border border-white/10"></textarea>
                            <div class="flex justify-between items-center mt-2">
                                <button id="copy-timestamps" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">すべてコピー</button>
                                <div class="flex items-center gap-2">
                                    <label for="offset-time" class="text-sm">オフセット:</label>
                                    <input type="text" id="offset-time" placeholder="+/- MM:SS" class="bg-white/10 border border-white/20 rounded-lg px-3 py-2 w-28">
                                    <button id="apply-offset" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-3 rounded-lg transition-colors">適用</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="../js/tools/youtube-studio-kit.js"></script>
</body>
</html>
