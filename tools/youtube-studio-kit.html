<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Studio Kit - 投稿準備アシスタント</title>
    
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    
</head>
<body class="font-sans editorial-mono">

    <div id="aurora-background"></div>

    <main class="main-container">
        <header class="card mb-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold">YouTube Studio Kit</h1>
            <a href="../index.html" class="px-4 py-2 text-sm font-semibold bg-white/10 rounded-lg hover:bg-white/20 transition-colors">ホームに戻る</a>
        </header>

        <!-- Tab Navigation -->
        <div class="card">
            <div class="flex border-b border-white/20">
                <button id="tab-thumbnail" class="tab-button active flex-1 py-3 px-4 font-semibold transition-colors">サムネイルプレビュー</button>
                <button id="tab-timestamp" class="tab-button flex-1 py-3 px-4 font-semibold transition-colors">タイムスタンプエディタ</button>
            </div>

            <!-- Thumbnail Previewer Content -->
            <div id="content-thumbnail" class="py-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div id="drop-zone-1" class="border-2 border-dashed border-gray-500 rounded-lg p-8 text-center cursor-pointer hover:bg-white/5 transition-colors">
                        <p>サムネイルAをドラッグ＆ドロップ</p>
                        <p class="text-sm text-gray-400">またはクリックして選択</p>
                        <input type="file" id="file-input-1" class="hidden" accept="image/*">
                    </div>
                    <div id="drop-zone-2" class="border-2 border-dashed border-gray-500 rounded-lg p-8 text-center cursor-pointer hover:bg-white/5 transition-colors">
                        <p>サムネイルB（比較用）</p>
                        <p class="text-sm text-gray-400">またはクリックして選択</p>
                        <input type="file" id="file-input-2" class="hidden" accept="image/*">
                    </div>
                </div>
                <div id="previews-container" class="mt-6 space-y-8">
                    <!-- Previews will be generated here by JavaScript -->
                </div>

                <!-- Thumbnail Editor -->
                <div id="thumbnail-editor" class="mt-8 p-4 card hidden">
                    <h3 class="font-bold mb-4">サムネイルエディタ</h3>
                    <div class="flex flex-col md:flex-row gap-4">
                        <div class="flex-grow relative">
                            <canvas id="thumbnail-canvas" class="w-full aspect-video border border-white/20 rounded-lg"></canvas>
                            <div id="canvas-overlay-controls" class="absolute top-2 right-2 flex gap-2">
                                <!-- Controls for overlay will go here -->
                            </div>
                        </div>
                        <div class="md:w-1/3 space-y-4">
                            <!-- Text Overlay Controls -->
                            <div>
                                <label for="overlay-text" class="block text-sm font-medium mb-1">オーバーレイテキスト</label>
                                <input type="text" id="overlay-text" class="w-full bg-white/10 border border-white/20 rounded-lg px-3 py-2" placeholder="テキストを入力">
                            </div>
                            <div>
                                <label for="text-font-size" class="block text-sm font-medium mb-1">フォントサイズ</label>
                                <input type="number" id="text-font-size" class="w-full bg-white/10 border border-white/20 rounded-lg px-3 py-2" value="48">
                            </div>
                            <div>
                                <label for="text-color" class="block text-sm font-medium mb-1">色</label>
                                <input type="color" id="text-color" class="w-full h-10 bg-white/10 border border-white/20 rounded-lg px-3 py-2" value="#FFFFFF">
                            </div>
                            <div class="flex gap-2">
                                <div>
                                    <label for="text-pos-x" class="block text-sm font-medium mb-1">X位置</label>
                                    <input type="number" id="text-pos-x" class="w-full bg-white/10 border border-white/20 rounded-lg px-3 py-2" value="640">
                                </div>
                                <div>
                                    <label for="text-pos-y" class="block text-sm font-medium mb-1">Y位置</label>
                                    <input type="number" id="text-pos-y" class="w-full bg-white/10 border border-white/20 rounded-lg px-3 py-2" value="360">
                                </div>
                            </div>

                            <!-- Text Layers Management -->
                            <div class="border-t border-white/20 pt-4 mt-4">
                                <h4 class="font-bold mb-2">テキストレイヤー</h4>
                                <div id="text-layers-list" class="space-y-2 mb-2">
                                    <!-- Text layers will be listed here -->
                                </div>
                                <div class="flex gap-2">
                                    <button id="add-text-layer-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition-colors flex-grow">レイヤーを追加</button>
                                    <button id="delete-text-layer-btn" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">削除</button>
                                </div>
                            </div>

                            <div class="flex gap-2">
                                <button id="download-thumbnail-btn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg transition-colors flex-grow">ダウンロード</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Timestamp Editor Content (Initially hidden) -->
            <div id="content-timestamp" class="py-4 hidden">
                <div id="youtube-url-container">
                    <h3 class="font-bold mb-2">1. YouTube動画のURLを入力</h3>
                    <form id="youtube-url-form" class="flex items-center gap-2">
                        <input type="text" id="youtube-url" placeholder="https://www.youtube.com/watch?v=..." class="flex-grow bg-white/10 border border-white/20 rounded-lg px-3 py-2">
                        <button type="submit" class="bg-pink-600 hover:bg-pink-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">読み込む</button>
                    </form>
                </div>

                <div id="player-container" class="hidden mt-6">
                    <h3 class="font-bold mb-2">2. 動画を再生してチャプターを作成</h3>
                    <div id="player" class="w-full aspect-video bg-black rounded-lg mb-4"></div>
                    <div id="custom-progress-bar" class="w-full h-2 bg-gray-700 rounded-full relative cursor-pointer mb-4">
                        <div id="progress-fill" class="h-full bg-pink-600 rounded-full" style="width: 0%;"></div>
                        <div id="timestamp-markers" class="absolute top-0 left-0 w-full h-full"></div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <!-- Editor -->
                        <div>
                            <form id="timestamp-form" class="flex items-center gap-2 mb-4">
                                <button type="button" id="get-current-time" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-3 rounded-lg transition-colors" title="現在の再生時間を入力">▶</button>
                                <input type="text" id="timestamp-time" placeholder="HH:MM:SS" class="bg-white/10 border border-white/20 rounded-lg px-3 py-2 w-28">
                                <input type="text" id="timestamp-title" placeholder="チャプター名" class="flex-grow bg-white/10 border border-white/20 rounded-lg px-3 py-2">
                                <button type="submit" class="bg-pink-600 hover:bg-pink-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">追加</button>
                            </form>
                            <div id="timestamp-list" class="space-y-2">
                                <!-- Timestamp items will be generated here -->
                            </div>
                        </div>
                        <!-- Output & Controls -->
                        <div>
                            <textarea id="timestamp-output" readonly class="w-full h-48 bg-black/20 rounded-lg p-2 border border-white/10"></textarea>
                            <div class="flex justify-between items-center mt-2">
                                <button id="copy-timestamps" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">すべてコピー</button>
                                <div class="flex items-center gap-2">
                                    <label for="offset-time" class="text-sm">オフセット:</label>
                                    <input type="text" id="offset-time" placeholder="+/- MM:SS" class="bg-white/10 border border-white/20 rounded-lg px-3 py-2 w-28">
                                    <button id="apply-offset" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-3 rounded-lg transition-colors">適用</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Video Metadata Editor -->
                <div id="video-metadata-editor" class="mt-8">
                    <h3 class="font-bold mb-2">3. 動画メタデータ</h3>
                    <div class="space-y-4">
                        <div>
                            <label for="video-title" class="block text-sm font-medium mb-1">動画タイトル</label>
                            <input type="text" id="video-title" class="w-full bg-white/10 border border-white/20 rounded-lg px-3 py-2" placeholder="動画のタイトルを入力">
                        </div>
                        <div>
                            <label for="video-description" class="block text-sm font-medium mb-1">動画説明</label>
                            <textarea id="video-description" class="w-full h-32 bg-white/10 border border-white/20 rounded-lg px-3 py-2" placeholder="動画の説明を入力"></textarea>
                        </div>
                        <div>
                            <label for="video-tags" class="block text-sm font-medium mb-1">タグ (カンマ区切り)</label>
                            <div class="flex gap-2">
                                <input type="text" id="video-tags" class="w-full bg-white/10 border border-white/20 rounded-lg px-3 py-2" placeholder="タグ1, タグ2, タグ3">
                                <button id="suggest-tags-btn" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-3 rounded-lg transition-colors">タグを提案</button>
                            </div>
                        </div>
                        <div class="flex justify-end">
                            <button id="copy-metadata" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">メタデータをコピー</button>
                        </div>
                    </div>
                </div>

                <!-- Description Template Generator -->
                <div id="description-template-generator" class="mt-8">
                    <h3 class="font-bold mb-2">4. 説明テンプレート</h3>
                    <div class="space-y-4">
                        <div>
                            <label for="description-template" class="block text-sm font-medium mb-1">テンプレート入力</label>
                            <textarea id="description-template" class="w-full h-32 bg-white/10 border border-white/20 rounded-lg px-3 py-2" placeholder="例:
{{title}}

こんにちは！今回の動画では...

{{timestamps}}

#{{tags}}"></textarea>
                        </div>
                        <div class="flex justify-end">
                            <button id="generate-description-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">説明を生成</button>
                        </div>
                    </div>
                </div>

                <!-- Social Media Link Manager -->
                <div id="social-media-links-manager" class="mt-8">
                    <h3 class="font-bold mb-2">5. ソーシャルメディアリンク</h3>
                    <div class="space-y-4">
                        <div class="flex gap-2">
                            <input type="text" id="social-link-name" class="w-1/3 bg-white/10 border border-white/20 rounded-lg px-3 py-2" placeholder="名前 (例: Twitter)">
                            <input type="url" id="social-link-url" class="flex-grow bg-white/10 border border-white/20 rounded-lg px-3 py-2" placeholder="URL (例: https://twitter.com/your_id)">
                            <button id="add-social-link-btn" class="bg-pink-600 hover:bg-pink-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">追加</button>
                        </div>
                        <div id="social-links-list" class="space-y-2">
                            <!-- Social media links will be displayed here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="../js/tools/youtube-studio-kit.js"></script>
</body>
</html>
