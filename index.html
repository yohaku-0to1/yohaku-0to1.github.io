    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>">

    <!-- External CSS -->
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- Tailwind CSS & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body class="font-sans">

    <div id="aurora-background"></div>

    <main class="main-container">

        <!-- Profile Section -->
        <section id="profile-section" class="card">
            <header id="page-header" class="flex flex-col items-center">
                <img id="profile-avatar" src="" alt="プロフィール画像" class="w-28 h-28 rounded-full mx-auto mb-4">
                <h1 id="profile-name" class="text-4xl font-bold"></h1>
                <p id="profile-bio" class="mt-2 text-lg text-center max-w-xs"></p>
            </header>
        </section>

        <!-- YouTube Section -->
        <section id="youtube-section" class="card">
            <h2 class="card-header">Featured Video</h2>
            <div id="youtube-container">
                <!-- JavaScriptによってここに動画が挿入されます -->
            </div>
        </section>

        <!-- LINE Sticker Section -->
        <section id="line-sticker-section" class="card">
            <h2 class="card-header">LINE Sticker</h2>
            <div id="line-sticker-content">
                <!-- JavaScriptによってここにLINEスタンプ情報が挿入されます -->
            </div>
        </section>

        <!-- Links Section -->
        <section id="links-section" class="card">
            <h2 class="card-header">Links</h2>
            <ul id="links-list" class="space-y-4">
                <!-- JavaScriptによってここにリンクが挿入されます -->
            </ul>
        </section>

        <!-- Tools Section -->
        <section id="tools-section" class="card">
            <h2 class="card-header">Tools</h2>
            <ul id="tools-list" class="space-y-4">
                <!-- JavaScriptによってここにツールが挿入されます -->
            </ul>
        </section>

        <!-- Chatbot Section -->
        <section id="chatbot-section" class="card">
            <h2 class="card-header">Chat with NEON</h2>
            <div id="neon-container" class="mb-4 flex justify-center">
                <img id="neon-image" src="" alt="ネオン" class="w-32 h-32">
            </div>
            <div id="chat-log" class="h-64 p-4 overflow-y-auto mb-4">
                <!-- Chat messages will appear here -->
            </div>
            <div id="chat-suggestions" class="flex flex-wrap gap-2 mb-2">
                <!-- JavaScriptによってここにチップが挿入されます -->
            </div>
            <div class="flex space-x-2">
                <input type="text" id="user-input" class="flex-grow px-4 py-2" placeholder="ネオンに話しかける...">
                <button id="send-button" class="font-bold py-2 px-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 10l7-7m0 0l7 7m-7-7v18" />
                    </svg>
                </button>
            </div>
        </section>

        <!-- Footer -->
        <footer id="page-footer" class="text-center py-6">
            <p class="text-sm">&copy; 2025 <span id="footer-username">Your Name</span>. All rights reserved.</p>
        </footer>

    </main>

    <!-- External JavaScript -->
    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
