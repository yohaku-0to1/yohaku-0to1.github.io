<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:description" content="AIで音楽や映像を作る「0と1のすきま」のポートフォリオサイト。">
    <meta property="og:image" content="https://yohaku-0to1.github.io/assets/images/neon_normal.png">

    <!-- Three.js & Post Processing -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
        }
      }
    </script>

    <!-- Twitter -->
    <title>Star Rush - Yohaku Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/game.css">
</head>

<body>
    <div class="game-container">
        <header class="game-header">
            <a href="index.html" class="back-button">← Back to Home</a>
            <h1 class="game-title">STAR RUSH</h1>
            <div class="score-display">SCORE: <span id="score">0</span></div>
        </header>

        <main class="game-area">
            <canvas id="gameCanvas"></canvas>

            <!-- HUD Overlay -->
            <div id="game-hud">
                <div class="dash-gauge">
                    <div class="dash-label">DASH</div>
                    <div class="dash-bar-container">
                        <div id="dashBar" class="dash-bar"></div>
                    </div>
                </div>
                <div class="coin-counter">
                    <span class="coin-icon">⭐</span>
                    <span id="coinCount">0</span>
                </div>
            </div>

            <div id="startScreen" class="overlay">
                <div class="overlay-content">
                    <h2>準備はいい？</h2>
                    <div class="controls-hint">
                        <div><span class="key-badge">スペース / ↑</span> ジャンプ</div>
                        <div><span class="key-badge">Shift</span> ダッシュ攻撃</div>
                        <div><span class="key-badge">← →</span> レーン移動</div>
                    </div>
                    <button id="startButton" class="game-btn">ゲーム開始</button>
                </div>
            </div>
            <div id="gameOverScreen" class="overlay hidden">
                <div class="overlay-content">
                    <h2>ゲームオーバー</h2>
                    <p>スコア: <span id="finalScore">0</span></p>
                    <p>コイン: <span id="finalCoins">0</span></p>

                    <div id="nameInputSection" style="margin: 20px 0;">
                        <input type="text" id="playerName" placeholder="名前を入力" maxlength="20"
                            style="padding: 10px; font-size: 1rem; border: 2px solid #db2777; background: rgba(15, 23, 42, 0.8); color: white; border-radius: 8px; text-align: center;">
                        <button id="submitScore" class="game-btn" style="margin-top: 10px;">スコアを送信</button>
                    </div>

                    <div id="rankingsSection" style="margin: 20px 0; max-height: 300px; overflow-y: auto;">
                        <h3 style="color: #fbbf24; margin-bottom: 10px;">🏆 世界ランキング</h3>
                        <div id="rankingsList"></div>
                    </div>

                    <button id="restartButton" class="game-btn">もう一度</button>
                </div>
            </div>
        </main>
    </div>
    <script type="module" src="js/game.js"></script>
</body>

</html>
