<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Protocol - サイバーパンク・ローグライク</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/battle.css">
</head>

<body>
    <div class="crt-overlay"></div>
    <div id="game-container">
        <div id="background-layer">
            <div class="city-skyline"></div>
            <div class="digital-rain"></div>
            <div class="grid-floor"></div>
        </div>

        <div id="turn-indicator" class="turn-indicator" style="display: none;">PLAYER TURN</div>

        <div id="map-screen" class="modal" style="display: none;">
            <div class="modal-content map-content">
                <h2 id="map-title">セクターマップ</h2>
                <div id="map-visual-container">
                    <!-- SVG for connections -->
                    <svg id="map-connections" width="100%" height="100%"></svg>
                    <!-- Nodes will be added here -->
                    <div id="map-nodes"></div>
                </div>
                <button id="map-close-btn" class="btn-primary" style="display: none;">閉じる</button>
            </div>
        </div>

        <div id="game-ui">
            <!-- ヘッダー -->
            <div id="header">
                <div class="header-left">
                    <span class="layer-display">Layer <span id="current-layer">1</span></span>
                    <span class="credits-display">💎 <span id="current-credits">100</span></span>
                </div>
                <div class="header-center">
                    <h1 class="game-title">NEON PROTOCOL</h1>
                </div>
                <div class="header-right">
                    <div id="relic-bar"></div>
                    <div class="stat-display">
                        <span class="stat-label">RAM</span>
                        <span class="stat-value"><span id="current-ram">4</span>/<span id="max-ram">4</span></span>
                    </div>
                    <div class="stat-display">
                        <span class="stat-label">Integrity</span>
                        <span class="stat-value"><span id="current-integrity">90</span>/<span
                                id="max-integrity">90</span></span>
                    </div>
                </div>
            </div>

            <!-- 戦闘エリア -->
            <div id="battle-area">
                <!-- 敵エリア -->
                <div id="enemies-container">
                    <!-- 敵はJSで動的に生成 -->
                </div>

                <!-- プレイヤーエリア -->
                <div id="player-area">
                    <div id="player-character">
                        <div id="player-status-effects"></div>
                        <div class="character-name">NEON</div>
                        <div class="character-stats">
                            <div class="stat-row" id="player-firewall-display" style="display: none;">
                                <span class="stat-icon">🛡️</span>
                                <span>Firewall: <span id="player-firewall">0</span></span>
                            </div>
                            <div class="stat-row" id="player-overclock-display" style="display: none;">
                                <span class="stat-icon">⚡</span>
                                <span>Overclock: +<span id="player-overclock">0</span></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 手札エリア -->
            <div id="hand-area">
                <div id="hand-container">
                    <!-- カードはJSで動的に生成 -->
                </div>
            </div>

            <!-- アクションエリア -->
            <div id="action-area">
                <button id="end-turn-btn" class="btn-primary">ターン終了</button>
                <div class="pile-info">
                    <span>山札: <span id="deck-count">0</span></span>
                    <span>捨て札: <span id="discard-count">0</span></span>
                </div>
            </div>
        </div>

        <!-- カード選択モーダル -->
        <div id="card-selection-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <h2 id="card-selection-title">カードを選択</h2>
                <div id="card-selection-container" class="card-container">
                    <!-- Cards will be added here -->
                </div>
                <button id="card-selection-cancel" class="btn-secondary" style="display: none;">キャンセル</button>
            </div>
        </div>

        <!-- ゲームオーバー画面 -->
        <div id="game-over-screen" class="modal" style="display: none;">
            <div class="modal-content">
                <h2 class="glitch">SYSTEM FAILURE</h2>
                <p>Integrity損傷。強制ログアウト。</p>
                <button onclick="location.reload()" class="btn-primary">再起動</button>
                <button onclick="showRankingScreen()" class="btn-secondary"
                    style="margin-top: 0.5rem;">ランキングを見る</button>
            </div>
        </div>

        <!-- 勝利画面 -->
        <div id="victory-screen" class="modal" style="display: none;">
            <div class="modal-content">
                <h2 class="glitch">ACCESS GRANTED</h2>
                <p>エリアクリア。次のノードへ移行中...</p>
                <div id="card-rewards">
                    <!-- カード報酬はJSで生成 -->
                </div>
                <button id="continue-btn" class="btn-primary">次へ</button>
            </div>
        </div>
    </div>

    <script src="js/cards-data.js"></script>
    <script src="js/enemies-data.js"></script>
    <script src="js/relics-data.js"></script>
    <script src="js/evolution.js"></script>
    <script src="js/events-data.js"></script>
    <script src="js/map.js"></script>
    <script src="js/card-upgrade.js"></script>
    <script src="js/persistence.js"></script>
    <script src="js/ranking.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/tutorial.js"></script>
    <script src="js/story.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/game.js"></script>
    <script src="js/battle.js"></script>
    <script src="js/ui.js"></script>

    <!-- Sound Toggle Button -->
    <button id="sound-toggle" class="sound-btn" onclick="toggleSound()">
        🔊
    </button>
</body>

</html>
